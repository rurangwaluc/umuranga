<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UMURANGA Home Images</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #F4EFE6;
        color: #1A1A16;
        font-family: Arial, sans-serif;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 28px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
      }

      figure {
        margin: 0;
        background: #FFFFFF;
        border: 1px solid #DDD0BE;
        border-radius: 16px;
        overflow: hidden;
      }

      img {
        width: 100%;
        height: 210px;
        object-fit: cover;
        display: block;
      }

      figcaption {
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>UMURANGA home images</h1>
    <div class="grid">
      <figure><img src="/images/home/agent-1.webp" /><figcaption>agent-1.webp</figcaption></figure>
      <figure><img src="/images/home/agent-2.webp" /><figcaption>agent-2.webp</figcaption></figure>
      <figure><img src="/images/home/agent-3.webp" /><figcaption>agent-3.webp</figcaption></figure>
      <figure><img src="/images/home/brokerage-building.webp" /><figcaption>brokerage-building.webp</figcaption></figure>
      <figure><img src="/images/home/easy-calendar.webp" /><figcaption>easy-calendar.webp</figcaption></figure>
      <figure><img src="/images/home/easy-payment.webp" /><figcaption>easy-payment.webp</figcaption></figure>
      <figure><img src="/images/home/easy-search.webp" /><figcaption>easy-search.webp</figcaption></figure>
      <figure><img src="/images/home/featured-villa.webp" /><figcaption>featured-villa.webp</figcaption></figure>
      <figure><img src="/images/home/hero-mini-1.webp" /><figcaption>hero-mini-1.webp</figcaption></figure>
      <figure><img src="/images/home/hero-mini-2.webp" /><figcaption>hero-mini-2.webp</figcaption></figure>
      <figure><img src="/images/home/hero-villa.webp" /><figcaption>hero-villa.webp</figcaption></figure>
      <figure><img src="/images/home/project-1.webp" /><figcaption>project-1.webp</figcaption></figure>
      <figure><img src="/images/home/project-2.webp" /><figcaption>project-2.webp</figcaption></figure>
      <figure><img src="/images/home/project-3.webp" /><figcaption>project-3.webp</figcaption></figure>

</html>
